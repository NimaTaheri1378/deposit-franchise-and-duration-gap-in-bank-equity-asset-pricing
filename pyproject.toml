[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deposit-duration-gap"
version = "0.1.0"
description = "Deposit franchise and duration gap in U.S. bank equity asset pricing"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "pyyaml>=6",
  "scipy>=1.11",
  "statsmodels>=0.14",
  "scikit-learn>=1.3",
  "matplotlib>=3.8",
  "pillow>=10",
  "seaborn>=0.13",
  "plotly>=5.20",
  "requests>=2.31",
  "tqdm>=4.66",
]

[project.optional-dependencies]
wrds = ["wrds>=3.2", "psycopg2-binary>=2.9"]
ml = ["lightgbm>=4.3", "optuna>=3.6", "shap>=0.45", "torch>=2.2"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.8"]
all = ["deposit-duration-gap[wrds,ml,dev]"]

[project.scripts]
ddgap = "deposit_duration.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
